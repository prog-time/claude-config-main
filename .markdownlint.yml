# Markdownlint configuration for claude-config-main
# Strategy: disable/relax rules that conflict with established repo style;
# keep rules that catch real regressions (broken heading structure,
# bad link syntax, wrong list numbering, etc.).

default: true

# MD013 — line length
# OFF: all 191 line-length violations reside in agents/ and templates/ where
# single-line prompt instructions are intentionally long. markdownlint-cli
# does not inherit nested configs automatically, so the only clean option is
# to disable globally. Other rules remain active to catch real regressions.
MD013: false

# MD022 — blanks around headings
# OFF: agent and skill files use compact heading+list blocks (no blank lines
# between heading and the immediately following bullet list) as a deliberate
# dense-prompt style. Enforcing this globally produces 37 false positives.
MD022: false

# MD024 — duplicate heading text
# Allow same-content headings at different nesting levels (e.g. page title
# "# Commands" + section "## Commands" in commands/README.md).
MD024:
  allow_different_nesting: true

# MD029 — ordered list prefix style
# OFF: agent files use 1/2/3 sequential numbering inside prose sections;
# enforcing 1/1/1 (lazy) style breaks readability of multi-step instructions.
MD029: false

# MD031 — blank lines around fenced code blocks
# OFF: agent and skill files embed fenced blocks inside tight list items and
# table-like prose sections where surrounding blank lines break the layout.
# 96 violations, all in intentional compact-prompt style.
MD031: false

# MD032 — blank lines around lists
# OFF: same rationale as MD031 — agent/skill files use lists inside dense
# prompt blocks without surrounding blank lines (174 violations by design).
MD032: false

# MD033 — inline HTML
# OFF (pre-existing): some docs use HTML for formatting intentionally.
MD033: false

# MD036 — emphasis used instead of a heading
# OFF: task files use **Type:**, **Size:**, **Status:** bold-label headers
# in their frontmatter sections; this is the canonical spec-writer format.
MD036: false

# MD040 — fenced code blocks should have a language specified
# OFF: many agent and doc files use bare ``` blocks for plaintext output,
# shell sessions, and pseudo-code that has no meaningful language tag.
# 124 violations, adding "text" or "plaintext" is a separate clean-up task.
MD040: false

# MD041 — first line should be a top-level heading
# OFF: agent files start with a prose instruction line (the system prompt
# role declaration), and command files start with YAML frontmatter —
# neither pattern begins with a # heading by design.
MD041: false

# MD058 — blank lines around tables
# OFF: agent files place tables immediately after their section headings
# without a separating blank line, matching the compact-prompt style used
# throughout agents/ and commands/. 4 violations.
MD058: false

# MD060 — fenced code block style
# OFF (pre-existing): repo uses both backtick and tilde fences.
MD060: false
